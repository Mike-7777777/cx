name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
      - run: go test ./... -v -count=1 -race
      - run: go build -trimpath -ldflags="-s -w" -o cx .
        if: runner.os != 'Windows'
      - run: go build -trimpath -ldflags="-s -w" -o cx.exe .
        if: runner.os == 'Windows'
      - run: go vet ./...
