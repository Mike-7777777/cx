version: "2"
linters:
  default: standard
  enable:
    - gocritic
    - misspell
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - linters:
          - staticcheck
        text: "QF"
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - commentedOutCode
        - ifElseChain
        - exitAfterDefer
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
issues:
  max-issues-per-linter: 50
  max-same-issues: 5
formatters:
  enable:
    - gofmt
