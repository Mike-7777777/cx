version: 2
builds:
  - id: cx
    main: .
    binary: cx
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
brews:
  - repository:
      owner: Mike-7777777
      name: homebrew-tap
    homepage: https://github.com/Mike-7777777/cx
    description: Claude Code multi-account manager
    install: |
      bin.install "cx"
    test: |
      system "#{bin}/cx", "version"
scoops:
  - repository:
      owner: Mike-7777777
      name: scoop-bucket
    homepage: https://github.com/Mike-7777777/cx
    description: Claude Code multi-account manager
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
